name: Reproduce processed-data analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out analysis inputs without videos
        # https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/data/raw/video/
          sparse-checkout-cone-mode: false

      - name: Set up Python ${{ matrix.python-version }}
        # https://github.com/actions/setup-python/releases/tag/v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install analysis package
        run: python -m pip install -e .

      - name: Run regression tests
        run: python -m unittest discover -s tests

      - name: Verify workbooks and referenced raw-force files
        run: python -m human_texture verify --data-dir data

      - name: Reproduce tables, figures, and audit
        run: python -m human_texture reproduce --data-dir data --output-dir outputs/reproduction

      - name: Upload reproduction results
        # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproduction-python-${{ matrix.python-version }}
          path: outputs/reproduction/
          if-no-files-found: error
          retention-days: 14
